# Optional, non-confidential watchlist. Every field is optional.
#
# If provided, the translation layer weights legal relevance toward the
# services / regions / concerns you actually run. If this file is absent or
# empty, the tool reports on everything it detects (no filtering).
#
# Nothing here is confidential: it is a coarse "what do we care about" hint,
# not a description of your architecture. Edit freely or delete the file.

# Services you rely on (used to prioritize SLA screening and terms changes).
# Use AWS short names. Examples: EC2, S3, RDS, Lambda, DynamoDB, EKS.
aws_services_used:
  - EC2
  - S3

# Regions you operate in. This is a FILTER on operational (Health feed) events:
# when set, only events affecting these regions are reported in full. Global or
# multi-region events are always in scope. Terms and SLA changes are never
# filtered by region. Leave empty to report events from every region.
regions_used:
  - us-east-1
  - us-west-2

# What to do with operational events OUTSIDE regions_used:
#   appendix (default) — show them as one-line entries in the NOISE appendix
#   strict             — exclude them entirely
# Has no effect when regions_used is empty.
region_filter_mode: appendix

# Free-form flags that raise the priority of matching events/changes.
# Suggested flags: data_residency, hipaa, fedramp, gpu_capacity, ai_ml_terms
heightened_concerns:
  - data_residency
  - gpu_capacity

# --- Email delivery (optional) ---
# After each run the memo is emailed here (HTML body + Markdown attachment).
# Leave email_to blank to disable sending entirely.
# The SMTP username and app password are secrets and live in .env / GitHub
# Actions secrets (SMTP_USERNAME, SMTP_APP_PASSWORD) — never in this file.
email_to: erinecrum@gmail.com
smtp_host: smtp.gmail.com   # Gmail default; change for another provider
smtp_port: 587              # STARTTLS
